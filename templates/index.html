
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InternMatch - Find Internships</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4 mx-auto" style="max-width: 650px;">

            <h1 class="text-center mb-3">InternMatch</h1>

            <p class="text-center text-muted">
                Find internships that match your skills and interests!
            </p>

            <form action="/" method="POST">

                <div class="mb-3">
                    <label class="form-label">Your Skills</label>
                    <input
                        type="text"
                        class="form-control"
                        name="skills"
                        placeholder="Python, SQL, HTML"
                        required>
                    <small class="text-muted">
                        Separate multiple skills with commas.
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Area of Interest</label>
                    <select name="interest" class="form-select" required>
                        <option value="">Select your interest</option>
                        <option value="Software Development">Software Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Web Development">Web Development</option>
                        <option value="AI">AI</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Preferred City</label>
                    <select name="city" class="form-select" required>
                        <option value="">Select your city</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Hyderabad">Hyderabad</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Preferred Work Mode</label>
                    <select name="mode" class="form-select" required>
                        <option value="">Select work mode</option>
                        <option value="On-site">On-site</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Remote">Remote</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Find Internships
                </button>

            </form>

        </div>

    </div>

</body>
</html>
